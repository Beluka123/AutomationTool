- block: 

  - name: enable required kernel settings
    ansible.builtin.shell: sysctl -w net.ipv4.conf.all.src_valid_mark=1 && sysctl -w net.ipv4.ip_forward=1

  - name: start wireguard-server
    community.docker.docker-container:
      name: wireguard-server
      image: linuxserver/wireguard:latest
      state: started
      restart_policy: unless-stopped
      capabilities:
        - NET_ADMIN
        - SYS_MODULE
      env:
        PUID: 1000
        PGID: 1000
        SERVERURL: "{{ hostvars['localhost'].ansible_facts.default_ipv4.address }}"
        SERVERPORT: 51820
        PEERS: interserver,nuxt
        INTERNAL_SUBNET: 10.13.13.0
        ALLOWEDIPS: 10.13.13.0/24
      volumes:
        - "{{ role_path }}/files/config:/config"
        - /lib/modules:/lib/modules
      network_mode: host
    register: wireguard_server_log
  delegate_to: localhost
  connection: local
  run_once: true

- name: create wireguard directory
  ansible.builtin.file:
    path: /opt/wireguard
    owner: 1000
    group: 1000
    state: directory
    recurse: true

- name: copy wireguard config
  ansible.builtin.copy:
    src: "{{ role_path }}/files/config/peer_{{ inventory_hostname }}/peer_{{ inventory_hostname }}.conf"
    dest: /opt/wireguard/wg0.conf

- name: start wireguard-client
  community.docker.docker-containter:
    name: wireguard-client
    image: linuxserver/wireguard:latest
    state: started
    capabilities:
      - NET_ADMIN
      - SYS_MODULE
    env:
      PUID: 1000
      PGID: 1000
    volumes:
      - /opt/wireguard/wg0.conf:/config/wg_confs/wg0.conf
      - /lib/modules:/lib/modules
    restart_policy: unless-stopped
    network_mode: host
  register: wireguard_client_log
